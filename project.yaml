category: mobile
status: done
name: nodal

description: >
  Kotlin Multiplatform Compose-приложение для полиномиальной интерполяции
  табличных функций: семь классических методов, визуализация в реальном
  времени.

stack:
  - Compose Multiplatform
  - Material 3
  - Voyager
  - Koin
  - MVVM + UDF
  - kotlin-bignum

possibilities:
  - '7 методов интерполяции: Лагранж, Ньютон вперёд/назад, Гаусс вперёд/назад, Стирлинг, Бессель.'
  - 'Каждая формула считается по классической трактовке: за пределами штатного диапазона метода показывается предупреждение, но значение всё равно вычисляется.'
  - Все расчёты на BigDecimal с настраиваемым числом знаков.
  - 'Интерактивный график: одновременная отрисовка всех методов, можно переключать видимость отдельных кривых.'
  - Общий код на Compose Multiplatform под Android и iOS.
